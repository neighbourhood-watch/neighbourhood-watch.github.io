<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; media-src https:; frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com https://w.soundcloud.com https://open.spotify.com https://archive.org https://drive.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="theme-color" content="#163e36" />
    <title>Incident Register</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="./"><i data-lucide="shield-check" aria-hidden="true"></i><span>Incident Register</span></a>
      <nav aria-label="Main"><a href="./admin.html"><i data-lucide="pencil" aria-hidden="true"></i>Editor</a><button id="lock" class="header-button" hidden><i data-lucide="lock-keyhole" aria-hidden="true"></i>Lock</button></nav>
    </header>
    <main id="main">
      <section id="gate" class="access-layout" aria-labelledby="gate-title">
        <div class="access-mark"><i data-lucide="folder-lock" aria-hidden="true"></i></div>
        <p class="eyebrow">RESTRICTED ACCESS</p>
        <h1 id="gate-title">Incident register</h1>
        <p id="gate-caption" class="muted">Enter the viewer password to continue.</p>
        <form id="unlock-form" class="access-form">
          <label for="password">Viewer password</label>
          <div class="password-field"><input id="password" type="password" autocomplete="current-password" required maxlength="256" aria-describedby="gate-error" /><button type="button" class="icon-button password-toggle" data-password="password" aria-label="Show password" aria-pressed="false" title="Show password"><i data-lucide="eye" aria-hidden="true"></i></button></div>
          <button class="primary wide" type="submit"><i data-lucide="arrow-right" aria-hidden="true"></i>Open register</button>
        </form>
        <p id="gate-error" class="notice" role="alert" tabindex="-1" hidden></p>
        <a id="setup-link" href="./admin.html" hidden>Set up the register</a>
      </section>
      <section id="register" class="page" hidden aria-labelledby="register-title">
        <div class="page-heading"><div><p class="eyebrow">SECURITY / INCIDENT ARCHIVE</p><h1 id="register-title">Incident register<span class="heading-dot">.</span></h1></div><span class="access-badge"><i data-lucide="unlock-keyhole" aria-hidden="true"></i>Viewer access</span></div>
        <div class="register-toolbar">
          <div class="search-field"><i data-lucide="search" aria-hidden="true"></i><label class="sr-only" for="search">Search incidents</label><input id="search" type="search" placeholder="Search incidents" /></div>
          <div class="toolbar-select"><label for="kind-filter">Media</label><select id="kind-filter"><option value="all">All types</option><option value="video">Video</option><option value="image">Image</option><option value="audio">Audio</option></select></div>
          <div class="toolbar-select"><label for="sort">Order</label><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div>
        </div>
        <div class="archive-layout">
          <aside class="incident-sidebar" aria-label="Incidents"><div class="list-heading"><h2>Incidents</h2><span id="incident-count" role="status"></span></div><div id="incident-list" class="incident-list"></div></aside>
          <section id="incident-detail" class="incident-detail" aria-label="Selected incident"><div class="empty-state"><i data-lucide="files" aria-hidden="true"></i><h2>Select an incident</h2><p class="muted">No incident selected.</p></div></section>
        </div>
      </section>
    </main>
    <footer class="site-footer"><span>INCIDENT REGISTER</span><span>Restricted records</span></footer>
    <noscript><p class="notice error">JavaScript is required to decrypt this register.</p></noscript>
    <script type="module" src="./js/viewer.js"></script>
  </body>
</html>
